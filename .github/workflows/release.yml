name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build mod
      run: ./gradlew build --no-daemon

    - name: Find built JAR files
      id: find_jars
      run: |
        set -euo pipefail
        JAR_FILES=$(find build/libs -name "*.jar" \
          ! -name "*-sources.jar" \
          ! -name "*-dev.jar" \
          ! -name "*-shadow.jar" \
          -type f)
        if [ -z "$JAR_FILES" ]; then
          echo "No JAR files found in build/libs" >&2
          exit 1
        fi
        echo "Found JAR files:"
        echo "$JAR_FILES"
        {
          echo "jar_files<<EOF"
          echo "$JAR_FILES"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Resolve release tag
      id: resolve_tag
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "release" ]; then
          TAG="${{ github.event.release.tag_name }}"
        else
          TAG=""
        fi

        if [ -z "$TAG" ]; then
          FIRST_JAR=$(echo "${{ steps.find_jars.outputs.jar_files }}" | head -n1)
          BASE=$(basename "$FIRST_JAR" .jar)
          VERSION=$(echo "$BASE" | sed -E 's/^[^-]+-([0-9][^-]*(-[^-]+)*)-mc.*$/\1/')
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          TAG="v${VERSION:-build}-${TIMESTAMP}"
        fi

        echo "Resolved tag: $TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Upload artifacts to release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      with:
        files: ${{ steps.find_jars.outputs.jar_files }}
        tag_name: ${{ steps.resolve_tag.outputs.tag }}
        name: Release ${{ steps.resolve_tag.outputs.tag }}
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts (for testing)
      uses: actions/upload-artifact@v4
      if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
      with:
        name: mod-build
        path: build/libs/*.jar
