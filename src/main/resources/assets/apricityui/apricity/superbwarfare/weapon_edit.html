<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-viewport" content="mode=gui,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
    <meta name="aui-mouse-events" content="intercept">
</head>
<body>
    <div id="backdrop"></div>
    <!-- AUI 负责挂点命中区域和图标布局；圆圈、外框与连线由 WeaponEditScreen 独立绘制。 -->
    <div id="mount-layer" class="layer"></div>
    <div id="icon-layer" class="layer"></div>
    <div id="panel">
        <div id="panel-header">
            <div id="panel-current" class="attachment-icon">
                <slot render="item" interactive="0" pointer="0" size="16" iconScale="1"><item>minecraft:air</item></slot>
            </div>
            <div id="panel-name"></div>
            <div id="panel-uninstall"><span>&#8595;</span></div>
            <div id="panel-slot"></div>
        </div>
        <!-- AUI 原生 overflow / scrollbar；列表按实际数量生成，没有固定格数上限。 -->
        <div id="panel-scroll"><div id="panel-grid"></div><div id="panel-empty"></div></div>
    </div>
</body>
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
    body { position: relative; color: #ffffff; font-size: 9px; }
    #backdrop { position: absolute; inset: 0; pointer-events: auto; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    #mount-layer { z-index: 2; }
    #icon-layer { z-index: 3; }
    /* 挂点仅提供透明点击区域，悬停不再改变其几何尺寸或触发圆圈的 CSS 绘制。 */
    .mount {
        position: absolute; display: none; box-sizing: border-box; width: 9px; height: 9px;
        border: 0; border-radius: 4.5px; background: none;
        align-items: center; justify-content: center; pointer-events: auto;
    }
    .mount-label {
        position: absolute; display: none; height: 11px; font-size: 7px; font-weight: normal;
        color: #ffffff; text-stroke: 1px #000000; text-align: center; white-space: nowrap;
        align-items: center; justify-content: center; pointer-events: none;
    }
    .mount-label.filled { color: #ffb43b; }
    .attachment-icon, .cell {
        position: absolute; display: none; box-sizing: border-box; width: 17px; height: 17px;
        padding: 0; border: 0.5px solid #ffffff; background: rgba(13, 15, 19, 0.7);
        align-items: center; justify-content: center; pointer-events: auto;
    }
    .attachment-icon:hover, .cell:hover { background: rgba(100, 110, 125, 0.75); border-color: #ffffff; }
    .attachment-icon.active { box-shadow: inset 0 0 0 0.5px #ffffff; }
    .attachment-icon.filled, .cell.selected { border-color: #ffb43b; }
    .attachment-icon.filled.active, .cell.selected { box-shadow: inset 0 0 0 0.5px #ffb43b; }
    /* 保留 0.5px 边框占位使物品居中，挂点图标的可见外框交给独立绘制阶段。 */
    #icon-layer > .attachment-icon { border-color: transparent; box-shadow: none; }
    slot, item { pointer-events: none; }
    /* 覆盖 AUI global.css 的 18px 槽位和 slot > item 的 left/top: 1px。
       CSS 自定义属性优先于 size/iconScale 属性，因此两种物品框都明确设置尺寸与缩放。 */
    .attachment-icon > slot, .cell > slot {
        --aui-slot-size: 16;
        --aui-slot-icon-scale: 1;
        width: 16px; height: 16px; flex-shrink: 0;
        margin: 0; padding: 0; border: 0; background: none;
    }
    .cell > slot {
        --aui-slot-size: 15;
        --aui-slot-icon-scale: 0.9375;
        width: 15px; height: 15px;
    }
    slot > item { left: 0; top: 0; width: 100%; height: 100%; }
    /* 外框固定为 132 × 94；Kotlin 使用相同尺寸进行避让与边缘钳制。 */
    #panel {
        position: absolute; display: none; box-sizing: border-box; width: 132px; height: 94px;
        border: 1px solid #ffffff; background: rgba(15, 17, 21, 0.76);
        transform-origin: 0 0; pointer-events: auto; z-index: 4; font-weight: normal;
    }
    #panel-header { position: absolute; left: 5px; top: 5px; width: 120px; height: 34px; }
    #panel-current { display: flex; left: 0; top: 0; }
    #panel-name {
        position: absolute; left: 22px; top: 1px; width: 98px; height: 14px;
        font-size: 9px; font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #panel-uninstall {
        position: absolute; display: flex; left: 0; top: 19px; width: 14px; height: 14px;
        box-sizing: border-box; border: 1px solid #ffffff; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.4); font-size: 12px;
    }
    #panel-uninstall span { pointer-events: none; }
    #panel-uninstall:hover { background: rgba(255, 255, 255, 0.25); }
    #panel-uninstall.disabled { opacity: 0.35; pointer-events: none; }
    #panel-slot { position: absolute; left: 18px; top: 22px; width: 102px; font-size: 8px; color: #d0d0d0; }
    #panel-scroll {
        position: absolute; left: 5px; top: 44px; width: 120px; height: 44px;
        box-sizing: border-box; border-top: 1px solid #ffffff; padding-top: 5px;
        overflow-x: hidden; overflow-y: auto; scrollbar-gutter: stable;
        scrollbar-width: 6px; scrollbar-color: #ffffff rgba(0, 0, 0, 0.55);
    }
    #panel-scroll::-webkit-scrollbar { width: 6px; }
    #panel-scroll::-webkit-scrollbar-track { background-color: rgba(0, 0, 0, 0.55); }
    #panel-scroll::-webkit-scrollbar-thumb { background-color: #ffffff; border-radius: 1px; }
    #panel-grid { display: flex; flex-direction: column; gap: 4px; width: 96px; }
    .row { display: flex; flex-direction: row; gap: 4px; height: 16px; flex-shrink: 0; }
    .cell { position: relative; display: flex; width: 16px; height: 16px; padding: 0; flex-shrink: 0; }
    #panel-empty { display: none; font-size: 9px; color: #bdbdbd; padding: 8px 0; }
</style>
</html>
