function text(c,str){const s=Number(c.dataset.scale||2);let total=0;const chars=[...str].map(ch=>{const map=glyphs[ch]||glyphs[' '];const x=total;total+=map[0].length+1;return{map,x,ch}});c.width=Math.max(1,total*s);c.height=8*s;c.style.width=c.width+'px';c.style.height=c.height+'px';const ctx=c.getContext('2d');const slashX=chars.find(c=>c.ch==="/")?.x??Infinity;for(let layer=0;layer<2;layer++)for(const {map,x,ch} of chars){const gray=c.dataset.color==='gray'||c.dataset.fraction==='true'&&state.dimDenominator&&x>=slashX;ctx.fillStyle=layer===0?'#333':c.dataset.color==='gold'?'#c8a679':c.dataset.color==='red'?'#ff6b5d':c.dataset.color==='cyan'?'#55ffff':gray?'#ccc':'#fff';const o=layer===0?s:0;map.forEach((row,y)=>[...row].forEach((v,px)=>{if(v==='1')ctx.fillRect((x+px)*s+o,y*s+o,s,s)}))}c.setAttribute('aria-label',str)}

const R={star:{name:'Nether Star',sources:['netherStar'],primary:'3200'},rifle:{name:'Rifle Ammo',sources:['rifle'],primary:'3304'},shotgun:{name:'Shotgun Ammo',sources:['shotgun'],primary:'128'},energy:{name:'Energy',sources:['energy'],primary:'72.0%'},health:{name:'Health',sources:['health'],primary:'179'},xp:{name:'Experience',sources:['xp'],primary:'1250'},taser:{name:'Electrode + Energy',sources:['electrode','energy'],primary:'24'},heavy:{name:'Heavy Ammo',sources:['heavy'],primary:'4'}};
const cases={
star:{name:'Super Star Shooter',gun:'starGun',mag:'300',virtualAmmo:99,resource:['star'],modes:['auto'],showResource:true,note:'300 发弹匣＋右上角虚拟备弹 +99；下方 3200 是完整下界之星可提供的发数。开始/完成换弹可演示 299→300、剩余 99 发进入虚拟备弹。'},
mag:{name:'AK-47',gun:'ak',mag:'30',resource:['rifle'],modes:['semi','auto'],initialMode:1,showResource:false,note:'有弹匣：大字为弹匣发数，小字为备弹；普通单一弹药不额外显示资源框。'},

};
const state={scene:'star',ammo:0,mode:0,slow:false,shortage:false,dimDenominator:true,starBefore:false};
const saved=window.openai?.widgetState?.privateContent;if(saved&&cases[saved.scene]){state.scene=saved.scene;state.ammo=Number(saved.ammo)||0;state.mode=Number(saved.mode)||0}
let animations=[],ticket=0,previewScale=1;
let gunEffect=null,isReloading=false,lastGunKey=null;
const weaponOrder=['star','mag','backpack','energy','multi','javelin','taser'];
function reduced(){return matchMedia('(prefers-reduced-motion:reduce)').matches}
function clearGunEffect(){if(gunEffect){gunEffect.cancel();gunEffect=null}const gun=root.querySelector('#hf-gun');gun.style.opacity='';gun.style.transform=''}
function equipEffect(){clearGunEffect();if(reduced())return;const gun=root.querySelector('#hf-gun');const effect=gun.animate([
 {offset:0,transform:'scale(1.08)',opacity:0,easing:'ease'},
 {offset:.3,transform:'scale(1.15)',opacity:1,easing:'ease'},
 {offset:1,transform:'scale(1)',opacity:1}
 ],{duration:state.slow?2000:500});gunEffect=effect;effect.onfinish=()=>{if(gunEffect===effect)gunEffect=null}}
function blinkEffect(){clearGunEffect();const gun=root.querySelector('#hf-gun');if(reduced()){gun.style.opacity='.55';return}gunEffect=gun.animate([{opacity:1},{opacity:0}],{duration:state.slow?1200:300,iterations:Infinity,direction:'alternate',easing:'ease'})}
function stopReload(replay){if(!isReloading)return;isReloading=false;clearGunEffect();if(replay)equipEffect()}
function updateReloadControl(){const button=root.querySelector('#hf-reload');button.disabled=!config().mag;button.textContent=isReloading?'完成换弹':'开始换弹';button.setAttribute('aria-pressed',String(isReloading))}
function updateWeaponIcon(c){const gun=root.querySelector('#hf-gun');if(lastGunKey===c.gun)return;const shouldAnimate=lastGunKey!==null;stopReload(false);clearGunEffect();gun.src=images[c.gun];lastGunKey=c.gun;if(shouldAnimate)equipEffect()}
function indexSize(){const f=Math.max(1,11/(14*previewScale));root.querySelectorAll(".hf-mode-index,.hf-ammo-index").forEach(c=>{c.style.width=c.width*f+"px";c.style.height=c.height*f+"px"})}
function cancel(){root.querySelector("#hf-frame").classList.remove("hf-moving-frame");root.querySelector('.hf-world').classList.remove('hf-resource-motion');ticket++;animations.forEach(a=>a.cancel());animations=[]}
function group(r){const node=document.createElement('div');node.className='hf-group';const inner=document.createElement('div');inner.className='hf-group-inner';node.append(inner);r.sources.forEach((s,i)=>{if(i){const plus=document.createElement('canvas');plus.dataset.scale='2';plus.className='hf-plus';text(plus,'+');inner.append(plus)}const wrap=document.createElement('span');wrap.className='hf-resource-image';const alert=state.shortage&&s==='energy'&&r.sources.length>1;if(symbols[s])wrap.append(symbol(s,alert));else{const im=document.createElement('img');im.src=images[s];im.alt=s;wrap.append(im)}if(alert){const c=document.createElement('canvas');c.dataset.scale='2';c.dataset.color='red';c.className='hf-resource-alert';text(c,'!');wrap.append(c)}inner.append(wrap)});return node}
function config(){return cases[state.scene]}
function selected(){return R[config().resource[state.ammo]]}
function frameWidth(r){return r.sources.length*32+(r.sources.length-1)*32+8}
function render(drawResource=true){
 const c=config();
 state.ammo=((state.ammo%c.resource.length)+c.resource.length)%c.resource.length;
 state.mode=((state.mode%c.modes.length)+c.modes.length)%c.modes.length;
 const r=selected(),beforeStar=state.scene==='star'&&state.starBefore;
 root.querySelector('#hf-scene').value=state.scene;
 text(root.querySelector('#hf-name'),c.name);text(root.querySelector('#hf-ammo-name'),r.name);updateWeaponIcon(c);
 const main=root.querySelector('#hf-main');text(main,beforeStar?'299':c.mag||r.primary);main.style.top=c.mag?'94px':'114px';
 const backup=root.querySelector('#hf-backup');backup.hidden=!c.mag;if(c.mag)text(backup,beforeStar?'3300':r.primary);
 const virtual=root.querySelector('#hf-virtual'),virtualAmount=beforeStar?0:Number(c.virtualAmmo||0);
 virtual.hidden=virtualAmount<=0;if(virtualAmount>0){text(virtual,'+'+virtualAmount);virtual.setAttribute('aria-label','虚拟备弹 '+virtualAmount+' 发');virtual.style.left=(343+main.width+8)+'px';virtual.style.top=(parseFloat(main.style.top)-14)+'px'}
 text(root.querySelector('#hf-key'),'[N]');
 const mode=c.modes[state.mode],modeImg=root.querySelector('#hf-mode');modeImg.src=images[mode];modeImg.alt=mode;
 modeImg.style.width=mode.startsWith('rpm')?'48px':'24px';modeImg.style.height=mode.startsWith('rpm')?'48px':'24px';
 const mi=root.querySelector('#hf-mode-index');mi.hidden=c.modes.length<=1;text(mi,(state.mode+1)+'/'+c.modes.length);
 const ai=root.querySelector('#hf-ammo-index');ai.hidden=c.resource.length<=1;text(ai,(state.ammo+1)+'/'+c.resource.length);
 const frame=root.querySelector('#hf-frame'),w=frameWidth(r),resourceLeft=343,resourceCenter=resourceLeft+w/2;
 frame.hidden=!c.showResource;frame.style.width=w+'px';frame.style.left=resourceLeft+'px';
 ai.style.left=resourceCenter+'px';root.querySelector('#hf-sprites').style.left=(resourceCenter-280)+'px';
 root.querySelector('.hf-queue-viewport').hidden=!c.showResource;if(drawResource)root.querySelector('#hf-sprites').replaceChildren(group(r));
 root.querySelector('#hf-ammo-prev').disabled=root.querySelector('#hf-ammo-next').disabled=c.resource.length<=1;root.querySelector('#hf-fire-next').disabled=c.modes.length<=1;
 root.querySelector('#hf-shortage-label').hidden=!r.sources.includes('energy')||r.sources.length<=1;root.querySelector('#hf-shortage').checked=state.shortage;
 root.querySelector('#hf-status').textContent=isReloading?(state.scene==='star'?'换弹前：299 发，33 颗下界之星可提供 3300 发；完成换弹后，1 发补满弹匣，剩余 99 发作为虚拟备弹。':'换弹中：仅武器图标闪烁；点击完成换弹结束。'):c.note;
 updateReloadControl();indexSize();
}
function save(){window.openai?.setWidgetState?.({modelContent:{scene:state.scene,ammo:state.ammo,mode:state.mode},privateContent:{scene:state.scene,ammo:state.ammo,mode:state.mode}})?.catch(()=>{})}
function switchAmmo(dir){if(config().resource.length<2)return;const old=selected();cancel();const token=ticket;root.querySelector("#hf-frame").classList.add("hf-moving-frame");root.querySelector(".hf-world").classList.add("hf-resource-motion");root.querySelector("#hf-frame").getBoundingClientRect();state.ammo=(state.ammo+dir+config().resource.length)%config().resource.length;render(false);const next=selected(),layer=root.querySelector('#hf-sprites');const out=group(old),incoming=group(next);layer.replaceChildren(out,incoming);const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;const duration=reduced?0:state.slow?1000:240;const distance=Math.max(frameWidth(old),frameWidth(next))+14;const timing={duration,easing:'cubic-bezier(.18,.7,.25,1)',fill:'forwards'};const a=out.animate([{transform:'translateX(0px)',opacity:1},{transform:'translateX('+(-dir*distance)+'px)',opacity:0}],timing);const b=incoming.animate([{transform:'translateX('+(dir*distance)+'px)',opacity:.28},{transform:'translateX(0px)',opacity:1}],timing);animations=[a,b];b.onfinish=()=>{if(ticket===token){a.cancel();b.cancel();layer.replaceChildren(group(selected()));animations=[];root.querySelector(".hf-world").classList.remove("hf-resource-motion");root.querySelector("#hf-frame").classList.remove("hf-moving-frame")}};save()}
function selectCase(key){cancel();stopReload(false);state.scene=key;state.ammo=0;state.mode=config().initialMode||0;state.shortage=false;state.starBefore=false;render();save()}
root.querySelector('#hf-scene').addEventListener('change',e=>selectCase(e.target.value));
root.querySelector('#hf-weapon-next').addEventListener('click',()=>{let i=(weaponOrder.indexOf(state.scene)+1)%weaponOrder.length;if(cases[weaponOrder[i]].gun===config().gun)i=(i+1)%weaponOrder.length;selectCase(weaponOrder[i])});
root.querySelector('#hf-reload').addEventListener('click',()=>{if(!config().mag)return;if(isReloading){state.starBefore=false;stopReload(true)}else{if(state.scene==='star')state.starBefore=true;isReloading=true;blinkEffect()}render()});
root.querySelector('#hf-ammo-prev').addEventListener('click',()=>switchAmmo(-1));root.querySelector('#hf-ammo-next').addEventListener('click',()=>switchAmmo(1));
root.querySelector('#hf-fire-next').addEventListener('click',()=>{if(config().modes.length<2)return;cancel();state.mode=(state.mode+1)%config().modes.length;render();if(!matchMedia('(prefers-reduced-motion:reduce)').matches)root.querySelector('#hf-mode').animate([{opacity:.3},{opacity:1}],{duration:state.slow?500:120,easing:'ease-out'});save()});
root.querySelector('#hf-slow').addEventListener('change',e=>{state.slow=e.target.checked;if(isReloading)blinkEffect()});root.querySelector('#hf-shortage').addEventListener('change',e=>{state.shortage=e.target.checked;cancel();render()});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&cases[s.scene]){if(s.scene===state.scene&&(Number(s.ammo)||0)===state.ammo&&(Number(s.mode)||0)===state.mode)return;cancel();if(s.scene!==state.scene){stopReload(false);state.starBefore=false}state.scene=s.scene;state.ammo=Number(s.ammo)||0;state.mode=Number(s.mode)||0;render()}});
new ResizeObserver(es=>{const s=Math.min(1,es[0].contentRect.width/600);previewScale=s;indexSize();root.querySelector('.hf-world').style.transform='scale('+s+')';root.querySelector('.hf-stage').style.height=270*s+'px'}).observe(root.querySelector('.hf-stage'));
window.addEventListener('pagehide',()=>{cancel();clearGunEffect();isReloading=false});
matchMedia('(prefers-reduced-motion:reduce)').addEventListener('change',()=>{if(isReloading)blinkEffect();else clearGunEffect()});
render();if(globalThis.Tweak){let t=new Tweak({container:root,onChange:()=>{cancel();render()}});t.addToggle(state,'dimDenominator',{label:'序号分母使用灰色'});}
})();
